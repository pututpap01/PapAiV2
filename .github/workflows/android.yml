name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    - name: Accept Android SDK Licenses
      run: |
        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)
        if [ -n "$SDKMANAGER" ]; then
          yes | $SDKMANAGER --licenses || true
        fi

    - name: Create .env and google-services.json if missing
      run: |
        if [ ! -f .env ]; then
          cp .env.example .env || echo "GEMINI_API_KEY=" > .env
        fi
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info":{"project_number":"123456789012","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456789012","android_client_info":{"package_name":"com.aistudio.papagenerator.wvapp"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForGoogleServices12345"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
        fi

    - name: Decode debug keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || rm -f debug.keystore
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
          fi
        fi

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PapAI-Generator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
