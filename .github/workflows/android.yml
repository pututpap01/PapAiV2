name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Prepare build environment
      run: |
        echo "GEMINI_API_KEY=dummy_key_for_ci_build" > .env
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info":{"project_number":"123456789012","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456789012","android_client_info":{"package_name":"com.aistudio.papagenerator.wvapp"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForGoogleServices12345"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
        fi
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || rm -f debug.keystore
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
          fi
        fi

    - name: Accept Android SDK Licenses
      run: |
        SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        if [ -d "$SDK_PATH" ]; then
          mkdir -p "$SDK_PATH/licenses"
          printf "89339af1705d50bea156801928b84318b382815a\nd56f5187479451eabf01fb78af6dfcb131a6481e\n243308028026e7d49401be651431db282ac37683\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c00507297be7305df2a9549d2d683735\nd938870314652a3760be04a06921a1202a9685a3\n33b622e746b0709770fbe4f6d3d5644e001c3422" > "$SDK_PATH/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c00507297be7305df2a9549d2d683735" > "$SDK_PATH/licenses/android-sdk-preview-license"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PapAI-Generator-APK
        path: app/build/outputs/apk/debug/app-debug.apk



